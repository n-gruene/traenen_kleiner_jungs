<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Berichtsheft-App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column vh-100">
  <!-- nav (horizontal) // ziel: komplett nur in desktopansicht sichtbar, mobil sichtbar sind sidebar-icon (hamburger), benachrichtigungs-icon (glocke) und profil-icon (dude)-->
  <nav class="navbar navbar-dark bg-secondary px-3" role="menu" aria-label="Horizontale Navigationsleiste bzw. Kopfleiste mit Titel usw.">
    <button type="button" class="navbar-toggler d-lg-none border-0" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="Sidebar öffnen" aria-expanded="false"><i class="navbar-toggler-icon"></i></button>
    <span class="navbar-brand fw-bold d-none d-lg-inline">Berichtsheft-App</span>
    <div class="text-white ms-auto">
      <i class="bi bi-bell-fill me-3 d-lg-none" role="menuitem" aria-label="Benachrichtigungen"></i><span class="d-none d-lg-inline">Silie, Peter </span><i class="bi bi-person-fill" role="menuitem" aria-label="Profil"></i>
    </div>
  </nav>

  <div class="d-flex flex-grow-1 overflow-hidden">
    <!-- sidebar (vertical) // ziel: in desktopansicht immer sichtbar, in mobiler ansicht ueber das hamburger menu zu oeffnen -->
    <div class="col-lg-2 d-flex flex-column bg-light-subtle">
      <div class="offcanvas-lg offcanvas-start d-flex flex-column flex-grow-1 bg-light-subtle" id="sidebar" tabindex="-1">
        <div class="offcanvas-header">
          <h5 id="sidebar-titel">Berichtsheft-App</h5><button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Sidebar schließen"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column flex-grow-1 p-0">
        <nav class="d-flex flex-column flex-grow-1" aria-label="Seitenmenü">
            <div class="list-group list-group-flush">
                <a href="#" class="list-group-item list-group-item-action border-0 border-start border-4 border-secondary list-group-item-light"><i class="bi bi-house-fill"></i> Start</a>
                <a href="#" class="list-group-item list-group-item-action border-0 border-start border-4 border-secondary list-group-item-secondary d-flex justify-content-between"><span><i class="bi bi-journal-text"></i> Wochenberichte</span><i class="bi bi-chevron-up"></i></a>
                <a href="#" class="list-group-item list-group-item-action border-0 list-group-item-secondary ps-4 py-1"><i class="bi bi-chevron-up"></i> 2026</a>
                <a href="#" class="list-group-item list-group-item-action border-0 list-group-item-secondary ps-5 py-1"><i class="bi bi-chevron-down"></i> Quartal 1</a>
                <a href="#" class="list-group-item list-group-item-action border-0 list-group-item-secondary ps-5 py-1"><i class="bi bi-chevron-down"></i> Quartal 2</a>
                <a href="#" class="list-group-item list-group-item-action border-0 list-group-item-secondary ps-5 py-1"><i class="bi bi-chevron-down"></i> Quartal 3</a>
                <a href="#" class="list-group-item list-group-item-action border-0 list-group-item-secondary ps-5 py-1 fw-bold" aria-current="page"><i class="bi bi-chevron-down"></i> Quartal 4</a>
                <a href="#" class="list-group-item list-group-item-action border-0 list-group-item-secondary ps-4 py-1"><i class="bi bi-chevron-down"></i> 2025</a>
                <a href="#" class="list-group-item list-group-item-action border-0 list-group-item-secondary ps-4 py-1"><i class="bi bi-chevron-down"></i> 2024</a>
                <a href="#" class="list-group-item list-group-item-action border-0 border-start border-4 border-secondary list-group-item-light d-none d-lg-block"><i class="bi bi-bell-fill"></i> Benachrichtigungen</a>
            </div>
            <div class="list-group list-group-flush mt-auto">
                <a href="#" class="list-group-item list-group-item-action border-0 border-start border-4 border-secondary list-group-item-light"><i class="bi bi-gear"></i> Einstellungen</a>
                <a href="#" class="list-group-item list-group-item-action border-0 border-start border-4 border-secondary list-group-item-light"><i class="bi bi-box-arrow-left"></i> Abmelden</a>
            </div>
        </nav>
        </div>
      </div>
    </div>

    <!-- main body // karten sollen stets in gleicher struktur bleiben. ausserdem landmark fuer screenreader -->
    <main class="flex-fill overflow-y-auto p-3 d-flex flex-column">
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- javascript von bootstrap. es waere schoen wenn es ohne ginge, aber anders liessen sich dropdown, offcanvas und aria toggles (expanded usw) kaum gut umsetzen -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
